<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="glassGloss" x1="0" y1="0" x2="128" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="notchShadow" x="20" y="10" width="88" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Glass Shimmer -->
  <rect x="8" y="8" width="112" height="56" rx="28" fill="url(#glassGloss)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Notch Pill Container -->
  <g filter="url(#notchShadow)">
    <rect x="30" y="18" width="68" height="22" rx="11" fill="#0a0a0c" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Equalizer Dots inside Notch -->
    <circle cx="42" cy="29" r="2" fill="#fbbf24"/>
    <circle cx="49" cy="29" r="3.5" fill="#f59e0b"/>
    <circle cx="56" cy="29" r="2.2" fill="#fbbf24"/>
    <text x="63" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="9" letter-spacing="1">DOPE</text>
  </g>

  <!-- NOTCH Wordmark Sculpted in Glass Body -->
  <text x="64" y="84" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="3.5">NOTCH</text>
  <text x="64" y="99" text-anchor="middle" fill="#fbbf24" fill-opacity="0.7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="8" letter-spacing="2">TOP-NOTCH AI</text>
</svg>
