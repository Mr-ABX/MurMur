<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1f2026"/>
      <stop offset="60%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <!-- App Icon Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Top-Left Mint / Green Bulb Gradient -->
    <radialGradient id="mintBulb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#b6fcd5"/>
      <stop offset="45%" stop-color="#6ee7b7"/>
      <stop offset="85%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>

    <!-- Center Indigo / Violet Bridge Gradient -->
    <linearGradient id="violetBridge" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Bottom-Right Pink / Magenta Bulb Gradient -->
    <radialGradient id="pinkBulb" cx="65%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Neon Glow Filter for Ribbon -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mask for Glass Highlight Overlay -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Shadow & Stroke -->
  <rect x="20" y="20" width="200" height="200" rx="52" fill="url(#bgGrad)" filter="url(#iconShadow)"/>
  <rect x="20.5" y="20.5" width="199" height="199" rx="51.5" stroke="url(#borderGrad)" stroke-width="1.2" fill="none"/>

  <!-- Animated Organic Torus / Wave Group -->
  <g id="ribbonGroup">
    <!-- Breathing / Floating Floating Animation -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-3; 0,2; 0,-1; 0,0" 
      dur="6s" 
      repeatCount="indefinite" 
      calcMode="spline" 
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
    />

    <!-- Ambient Ribbon Underglow -->
    <path d="M 82 82 C 60 104 68 140 102 152 C 136 164 168 152 162 120 C 156 92 120 84 104 98 C 92 108 92 124 108 136" 
      fill="none" 
      stroke="#8b5cf6" 
      stroke-width="48" 
      stroke-linecap="round" 
      filter="url(#neonGlow)" 
      opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- 1. Top-Left Mint Green Orb / Loop -->
    <circle cx="88" cy="92" r="32" fill="url(#mintBulb)" filter="url(#iconShadow)">
      <animate attributeName="r" values="32;33.5;32" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="cx" values="88;86;88" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>
    <!-- Mint Specular Light -->
    <ellipse cx="80" cy="82" rx="14" ry="8" transform="rotate(-35 80 82)" fill="#ffffff" opacity="0.45">
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="3s" repeatCount="indefinite" />
    </ellipse>

    <!-- 2. Central Fluid Connecting S-Tube (Violet / Indigo Mesh) -->
    <path d="M 88 92 C 112 68 160 92 144 136 C 132 168 88 164 100 136 C 108 116 140 112 152 140" 
      fill="none" 
      stroke="url(#violetBridge)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round">
      <animate attributeName="stroke-width" values="38;40;38" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </path>

    <!-- 3. Bottom-Right Pink / Magenta Orb / Loop -->
    <circle cx="150" cy="144" r="34" fill="url(#pinkBulb)" filter="url(#iconShadow)">
      <animate attributeName="r" values="34;35.5;34" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="cy" values="144;146;144" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>
    <!-- Pink Specular Light -->
    <ellipse cx="160" cy="150" rx="16" ry="9" transform="rotate(-25 160 150)" fill="#ffffff" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="3s" repeatCount="indefinite" />
    </ellipse>

    <!-- Glossy Glass Sheen Arc -->
    <path d="M 72 80 C 85 65 110 65 132 82 C 155 100 168 125 165 152" 
      fill="none" 
      stroke="url(#glassSheen)" 
      stroke-width="3" 
      stroke-linecap="round" 
      opacity="0.8">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
