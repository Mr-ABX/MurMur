name: 'Continuous Integration'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf cmake clang libclang-dev \
            libavdevice-dev libavfilter-dev libavformat-dev \
            libavcodec-dev libswscale-dev libswresample-dev ffmpeg

      - name: install LLVM (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install llvm cmake
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: install LLVM + cmake (windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install llvm -y

      - name: set LIBCLANG_PATH (windows)
        if: matrix.platform == 'windows-latest'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: set LIBCLANG_PATH (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV

      - name: install frontend dependencies
        run: npm install

      - name: Run Tests (Frontend)
        run: npm run test

      - name: Check TypeScript (Frontend)
        run: npm run build

      - name: Check Rust (Backend)
        run: cargo check
        working-directory: src-tauri

      - name: Test Rust (Backend)
        run: cargo test
        working-directory: src-tauri
