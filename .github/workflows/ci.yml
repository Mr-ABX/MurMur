name: 'Continuous Integration'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  fast-check:
    name: 'Fast Lint, Test & Typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Check TypeScript & Build
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf cmake clang libclang-dev \
            libavdevice-dev libavfilter-dev libavformat-dev \
            libavcodec-dev libswscale-dev libswresample-dev ffmpeg

      - name: Check Rust (src-tauri)
        run: cargo check
        working-directory: src-tauri

      - name: Test Rust (src-tauri)
        run: cargo test
        working-directory: src-tauri
